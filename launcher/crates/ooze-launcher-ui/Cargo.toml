[package]
name = "ooze-launcher-ui"
version = "0.1.0-rc1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Ooze Launcher desktop interface: screens, components, navigation, focus and product UI state over the launcher backend API"

[features]
default = []
# Test/preview-only scripted backend. A release build refuses it (compile_error! in lib.rs).
dev-fixtures = []

[dependencies]
ooze-launcher-core = { path = "../ooze-launcher-core" }
# Module catalog, typed settings, presets and profile documents (Claude, std only). One catalog
# for the game, the library and this interface.
ooze-ui = { path = "../../../native/crates/ooze-ui" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "wgpu", "x11", "wayland"] }
regex = "1.13"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["snapshot", "wgpu"] }

[[bin]]
name = "ooze-launcher"
path = "src/bin/ooze-launcher.rs"

[[bin]]
name = "ooze-launcher-preview"
path = "src/bin/ooze-launcher-preview.rs"
required-features = ["dev-fixtures"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
