# Fabric adapter for the Minecraft 26.1 family (pins verified 2026-11-26 against piston-meta.mojang.com,
# meta.fabricmc.net, Modrinth and the official fabric-example-mod 26.1.2 branch).
# One JAR for every listed version; each listed version must pass the production launch test.
minecraft_family=26.1
# Compile target (newest hotfix of the family, the one Fabric API was built for).
minecraft_version=26.1.2
# Exactly the versions this JAR declares in fabric.mod.json and is launch-tested on.
minecraft_compatible=26.1,26.1.1,26.1.2
loader_version=0.20.1
fabric_api_version=0.155.3+26.1.2
java_version=25
