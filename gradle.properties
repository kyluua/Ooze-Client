org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# JDK 21 and 25 installed by CI runners (actions/setup-java, GitHub images) are found here; other
# machines use the usual locations, and Gradle provisions a missing JDK through Foojay.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

# Ooze Client release version (SemVer). The distribution JAR appends +mc<minecraft_version>.
mod_version=0.1.0-rc1
maven_group=io.github.kyluua.ooze
