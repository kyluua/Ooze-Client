name: Ooze Launcher
on:
  push:
    paths: ['launcher/**', 'native/**', 'bridge-java/**', 'versions/**', '*.gradle.kts', 'gradle.properties', 'docs/tokens/**', 'rust-toolchain.toml', 'docs/launcher/**', 'docs/handoffs/CLAUDE-RC1.md', '.github/workflows/launcher-l0.yml']
  pull_request:
    paths: ['launcher/**', 'native/**', 'bridge-java/**', 'versions/**', '*.gradle.kts', 'gradle.properties', 'docs/tokens/**', 'rust-toolchain.toml', 'docs/launcher/**', 'docs/handoffs/CLAUDE-RC1.md', '.github/workflows/launcher-l0.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check and build the library CLI
        shell: pwsh
        run: |
          cargo fmt --manifest-path launcher/Cargo.toml --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --manifest-path launcher/Cargo.toml --locked -p ooze-launcher-core -p ooze-launcher-cli --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path launcher/Cargo.toml --locked -p ooze-launcher-core -p ooze-launcher-cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --manifest-path launcher/Cargo.toml --locked --release -p ooze-launcher-cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $cli='./launcher/target/release/ooze-launcher-cli.exe'
          ((Get-FileHash -LiteralPath $cli).Hash.ToLowerInvariant()+'  ooze-launcher-cli.exe') | Set-Content './launcher/target/release/CLI-SHA256SUMS' -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ooze-library-cli-candidate-windows-x64
          path: |
            launcher/target/release/ooze-launcher-cli.exe
            launcher/target/release/CLI-SHA256SUMS
      - name: Real Modrinth and transactional content check
        shell: pwsh
        run: ./launcher/packaging/test-library.ps1 -CliExe './launcher/target/release/ooze-launcher-cli.exe' -DataDirectory (Join-Path $env:RUNNER_TEMP 'Ooze library with spaces')
  windows-x64:
    needs: library-windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WGPU_BACKEND: dx12
      OOZE_UI_SCREENSHOT_DIR: '${{ github.workspace }}/launcher/test-data/ui-screenshots'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure the owned public Microsoft application
        shell: pwsh
        run: |
          $publicAuth = Get-Content -LiteralPath './launcher/packaging/public-auth.json' -Raw | ConvertFrom-Json
          $publicClientGuid = [Guid]::Empty
          if ($publicAuth.schema -ne 1 -or -not [Guid]::TryParseExact($publicAuth.microsoft_client_id, 'D', [ref]$publicClientGuid) -or $publicClientGuid -eq [Guid]::Empty) {
            throw 'Invalid public OAuth build configuration'
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "OOZE_MICROSOFT_CLIENT_ID=$($publicClientGuid.ToString('D'))`n", [Text.UTF8Encoding]::new($false))
      - name: Rust format, lint and workspace tests (real Windows GUI adapter)
        shell: pwsh
        run: |
          cargo fmt --manifest-path launcher/Cargo.toml --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --manifest-path launcher/Cargo.toml --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path launcher/Cargo.toml --locked --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build portable backend and desktop executables
        shell: pwsh
        run: |
          cargo build --manifest-path launcher/Cargo.toml --locked --release --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./launcher/target/release/ooze-launcher-cli.exe --version
      - name: Assemble real Ooze mod with production Windows engine
        shell: pwsh
        run: |
          ./native/tools/build-g0.ps1 -JavaHome $env:JAVA_HOME_21_X64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          ./gradlew.bat build buildAll --no-daemon --console=plain
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise real library and Modrinth dependency installation
        shell: pwsh
        run: |
          ./launcher/packaging/test-library.ps1 -CliExe './launcher/target/release/ooze-launcher-cli.exe' -DataDirectory (Join-Path $env:RUNNER_TEMP 'Ooze library with spaces')
      - name: Prepare portable review package and exercise install/repair
        shell: pwsh
        run: |
          $profile = Get-Content -Raw -LiteralPath './build/dist/ooze-launcher-profile.json' | ConvertFrom-Json
          $mod = @($profile.mods | Where-Object id -eq 'oozeclient')
          if ($profile.schema -ne 'oozelauncher.profile/1' -or $mod.Count -ne 1 -or
              $mod[0].file -notmatch '^ooze-client-[A-Za-z0-9.+-]+\.jar$') { throw 'Unexpected Fabric build profile' }
          $jar = Join-Path './build/dist' $mod[0].file
          if ((Get-FileHash -LiteralPath $jar).Hash -ne $mod[0].sha256) { throw 'Fabric build profile hash mismatch' }
          ./launcher/packaging/prepare-release.ps1 -OozeJar $jar -CliExe './launcher/target/release/ooze-launcher-cli.exe' -GuiExe './launcher/target/release/ooze-launcher.exe' -OutputDirectory './launcher/dist/ooze-rc1-windows-x64'
          $package = (Resolve-Path './launcher/dist/ooze-rc1-windows-x64').Path
          ./launcher/packaging/prepare-release.ps1 -OozeJar $jar -CliExe './launcher/target/release/ooze-launcher-cli.exe' -GuiExe './launcher/target/release/ooze-launcher.exe' -OutputDirectory './launcher/dist/pinned-repeat' -PinnedPackageDirectory $package
          foreach ($file in (Get-ChildItem -LiteralPath $package -File -Recurse)) {
            $relative = [IO.Path]::GetRelativePath($package,$file.FullName)
            $repeat = Join-Path './launcher/dist/pinned-repeat' $relative
            if ((Get-FileHash -LiteralPath $file.FullName).Hash -ne (Get-FileHash -LiteralPath $repeat).Hash) { throw "Pinned repeat changed: $relative" }
          }
          $testData = Join-Path $env:RUNNER_TEMP 'Ooze install with spaces'
          # Prove the package uses its managed runtime without Cargo/Gradle/JDK on PATH.
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue
          Remove-Item Env:JAVA_HOME_21_X64 -ErrorAction SilentlyContinue
          & "$package/ooze-launcher-cli.exe" --data-dir $testData install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$package/ooze-launcher-cli.exe" --data-dir $testData repair
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$package/ooze-launcher-cli.exe" --data-dir $testData status
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./launcher/packaging/test-targets.ps1 -PackageDirectory $package -DataDirectory $testData
      - name: Verify packaged diagnostics export
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'Ooze diagnostics with spaces'
          $logs = New-Item -ItemType Directory -Path (Join-Path $data 'logs')
          @(
            'OOZE_READY v1 screen=title engine=LOADED'
            'Authorization: Bearer test-bearer-only'
            '{"identityToken":"XBL3.0 x=user;test-xsts-only"}'
          ) | Set-Content -LiteralPath (Join-Path $logs.FullName 'game-1.log') -Encoding utf8NoBOM
          $archivePath = Join-Path $data 'diagnostics.zip'
          ./launcher/dist/ooze-rc1-windows-x64/ooze-launcher-cli.exe --data-dir $data export-diagnostics $archivePath
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = [IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $log = $archive.GetEntry('game.log')
            if ($archive.Entries.Count -ne 2 -or !$log -or !$archive.GetEntry('diagnostics.json')) { throw 'Unexpected diagnostics entries' }
            $reader = [IO.StreamReader]::new($log.Open())
            try { $text = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($text -notmatch 'OOZE_READY v1 screen=title engine=LOADED' -or
                $text -match 'test-(bearer|xsts)-only' -or
                [Regex]::Matches($text, '\[REDACTED\]').Count -ne 2) {
              throw 'Packaged diagnostics did not preserve readiness and redact credentials'
            }
          } finally { $archive.Dispose() }
      - name: Export and validate the Prism fallback
        shell: pwsh
        run: |
          $profile = Get-Content -Raw -LiteralPath './build/dist/ooze-launcher-profile.json' | ConvertFrom-Json
          $mod = $profile.mods | Where-Object id -eq 'oozeclient'
          if ($mod.version -ne '0.1.0-rc1+mc1.21.11') {
            Write-Output 'The Fabric source is still a pre-RC1 build. The fallback will be generated from the RC1 JAR.'
            return
          }
          ./launcher/packaging/prepare-mrpack.ps1 -PackageDirectory './launcher/dist/ooze-rc1-windows-x64' -OutputDirectory './launcher/dist/ooze-rc1-mrpack'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ooze-launcher-windows-x64
          path: launcher/dist/ooze-rc1-windows-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ooze-base-rc1-prism
          path: launcher/dist/ooze-rc1-mrpack/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ooze-launcher-ui-evidence
          path: launcher/test-data/ui-screenshots/
          if-no-files-found: ignore
