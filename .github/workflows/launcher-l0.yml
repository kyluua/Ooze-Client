name: Launcher L0
on:
  push:
    paths: ['launcher/**', 'docs/launcher/**', '.github/workflows/launcher-l0.yml']
  pull_request:
    paths: ['launcher/**', 'docs/launcher/**', '.github/workflows/launcher-l0.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure the owned public Microsoft application
        shell: pwsh
        run: |
          $publicAuth = Get-Content -LiteralPath './launcher/packaging/public-auth.json' -Raw | ConvertFrom-Json
          $publicClientGuid = [Guid]::Empty
          if ($publicAuth.schema -ne 1 -or -not [Guid]::TryParseExact($publicAuth.microsoft_client_id, 'D', [ref]$publicClientGuid) -or $publicClientGuid -eq [Guid]::Empty) {
            throw 'Invalid public OAuth build configuration'
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "OOZE_MICROSOFT_CLIENT_ID=$($publicClientGuid.ToString('D'))`n", [Text.UTF8Encoding]::new($false))
      - name: Rust format, lint and backend tests
        shell: pwsh
        run: |
          cargo fmt --manifest-path launcher/Cargo.toml --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --manifest-path launcher/Cargo.toml --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path launcher/Cargo.toml --locked --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build portable backend executable
        shell: pwsh
        run: |
          cargo build --manifest-path launcher/Cargo.toml --locked --release --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./launcher/target/release/ooze-launcher-cli.exe --version
      - name: Assemble real Ooze mod with production Windows engine
        shell: pwsh
        run: |
          ./native/tools/build-g0.ps1 -JavaHome $env:JAVA_HOME_21_X64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          ./gradlew.bat build buildAll --no-daemon --console=plain
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare portable review package and exercise install/repair
        shell: pwsh
        run: |
          ./launcher/packaging/prepare-release.ps1 -OozeJar './build/dist/ooze-client-0.1.0-alpha.0+mc1.21.11.jar' -CliExe './launcher/target/release/ooze-launcher-cli.exe' -OutputDirectory './launcher/dist/ooze-l0-windows-x64'
          $package = (Resolve-Path './launcher/dist/ooze-l0-windows-x64').Path
          ./launcher/packaging/prepare-release.ps1 -OozeJar './build/dist/ooze-client-0.1.0-alpha.0+mc1.21.11.jar' -CliExe './launcher/target/release/ooze-launcher-cli.exe' -OutputDirectory './launcher/dist/pinned-repeat' -PinnedPackageDirectory $package
          foreach ($file in (Get-ChildItem -LiteralPath $package -File -Recurse)) {
            $relative = [IO.Path]::GetRelativePath($package,$file.FullName)
            $repeat = Join-Path './launcher/dist/pinned-repeat' $relative
            if ((Get-FileHash -LiteralPath $file.FullName).Hash -ne (Get-FileHash -LiteralPath $repeat).Hash) { throw "Pinned repeat changed: $relative" }
          }
          $testData = Join-Path $env:RUNNER_TEMP 'Ooze install with spaces'
          # Prove the package uses its managed runtime without Cargo/Gradle/JDK on PATH.
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue
          Remove-Item Env:JAVA_HOME_21_X64 -ErrorAction SilentlyContinue
          & "$package/ooze-launcher-cli.exe" --data-dir $testData install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$package/ooze-launcher-cli.exe" --data-dir $testData repair
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$package/ooze-launcher-cli.exe" --data-dir $testData status
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ooze-launcher-l0-backend-windows-x64
          path: launcher/dist/ooze-l0-windows-x64/
          if-no-files-found: error
